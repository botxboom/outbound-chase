version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outbound_chase
      POSTGRES_USER: outbound
      POSTGRES_PASSWORD: outbound
    ports:
      - "5434:5432"  # 5434 on host — avoids conflict with local Homebrew Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbound -d outbound_chase"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.0
    ports:
      - "7233:7233"
      - "8080:8080"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=outbound
      - POSTGRES_PWD=outbound
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.21.0
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  app:
    build: .
    ports:
      - "8000:8000"
    command: ["python", "-m", "src.main", "--mode", "server"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://outbound:outbound@postgres:5432/outbound_chase
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - USE_MOCK_CHANNELS=true
      - VOICE_MODE=simulated
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  worker:
    build: .
    command: ["python", "-m", "src.main", "--mode", "worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://outbound:outbound@postgres:5432/outbound_chase
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - USE_MOCK_CHANNELS=true
      - VOICE_MODE=simulated
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  postgres_data:
